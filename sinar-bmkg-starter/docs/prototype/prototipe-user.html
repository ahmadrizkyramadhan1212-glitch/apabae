<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SINAR BMKG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Cinzel:wght@700&family=Cormorant+Garamond:wght@700&family=Dancing+Script:wght@700&family=Great+Vibes&family=Libre+Baskerville:wght@700&family=Montserrat:wght@700&family=Pinyon+Script&family=Playfair+Display:wght@700&display=swap"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><style>
:root{--p:#0B3C8C;--p2:#2E7DD1;--sky:#E6F1FC;--g:#2E9E4F;--tl:#12A5B8;--bg:#F4F6FA;--c:#fff;--t:#1B2433;--m:#6B7685;--bd:#E3E8F0;--ok:#22A06B;--wa:#F5B700;--er:#D93C3C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:14px;min-height:100vh}
a{color:inherit;text-decoration:none}
.side{position:fixed;inset:0 auto 0 0;width:236px;background:linear-gradient(170deg,var(--p),var(--p2));color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:4px;z-index:5;transition:.2s}
.lg{display:flex;align-items:center;gap:10px;margin-bottom:14px}.lg i{display:flex}.lg img{height:46px;width:auto}.lg b{font-size:17px;display:block}.lg small{font-size:10px;opacity:.85}
.side a.m{padding:10px 12px;border-radius:8px;font-weight:500}.side a.on,.side a.m:hover{background:rgba(255,255,255,.18)}.side h6{font-size:10px;opacity:.7;margin:12px 12px 2px;letter-spacing:.08em}
.main{margin-left:236px;padding:20px 28px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}.top h1{font-size:22px}.top p{color:var(--m)}
.pub{max-width:1100px;margin:auto;padding:0 20px 40px}.nav{display:flex;align-items:center;gap:6px;padding:12px 0;flex-wrap:wrap}.nav .lg{margin:0 auto 0 0}.nav .lg b{color:var(--p)}.nav .lg small{color:var(--m)}.nav a.l{padding:8px 12px;border-radius:8px;font-weight:500}.nav a.on{background:var(--sky);color:var(--p)}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(11,79,158,.06),0 6px 16px rgba(11,79,158,.05)}
.hero{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;border-radius:14px;padding:30px;position:relative;overflow:hidden;margin-bottom:16px}.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.12)}.hero h2{font-size:24px;margin-bottom:6px}.hero p{opacity:.92;margin-bottom:14px;max-width:520px}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 16px;font:600 14px inherit;cursor:pointer;background:var(--c);color:var(--p);border:1px solid var(--bd)}.btn.pr{background:var(--g);color:#fff;border-color:var(--g)}.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.w{background:#fff;color:var(--p)}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.st b{font-size:26px;display:block;color:var(--p)}.st span{color:var(--m)}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}.Dijadwalkan{background:#FFF4CC;color:#8A6500}.Berlangsung{background:#D9F3E8;color:#157A52}.Selesai{background:#E7EAF0;color:#4A5565}.Dibatalkan{background:#FBE0E0;color:#A32727}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--m);text-transform:uppercase;padding:8px;border-bottom:1px solid var(--bd)}td{padding:10px 8px;border-bottom:1px solid var(--bd)}.sc{overflow-x:auto}
.tl{position:relative;height:704px;margin-left:50px}.tl .h{position:absolute;left:-50px;width:44px;text-align:right;font-size:11px;color:var(--m);transform:translateY(-7px)}.tl .ln{position:absolute;left:0;right:0;border-top:1px solid var(--bd)}
.ev{position:absolute;left:6px;right:6px;border-radius:8px;padding:6px 10px;border-left:4px solid var(--p);background:var(--sky);overflow:hidden;font-size:13px}.ev.Berlangsung{border-color:var(--ok);background:#D9F3E8;color:#0f3d2b}.ev.Selesai{border-color:#8A94A3;background:#E7EAF0;color:#2b3340}.ev b{display:block}
.slot{position:absolute;left:6px;right:6px;border:2px dashed var(--bd);border-radius:8px;color:var(--m);display:flex;align-items:center;justify-content:center;font-size:12px}.slot:hover{border-color:var(--tl);color:var(--tl)}
.strip{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}.strip a{flex:1;min-width:58px;text-align:center;padding:8px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--c)}.strip a.on{background:var(--p);color:#fff;border-color:var(--p)}.strip small{display:block;font-size:10px;opacity:.8}
.cols{display:grid;grid-template-columns:1fr 280px;gap:16px}label{display:block;font-weight:600;margin:10px 0 4px}input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--c);color:var(--t);font:inherit}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.steps span{padding:6px 12px;border-radius:99px;background:var(--bd);color:var(--m);font-weight:600;font-size:12px}.steps .on{background:var(--p);color:#fff}.steps .dn{background:var(--ok);color:#fff}
.ind{padding:12px;border-radius:10px;font-weight:600;margin-top:12px}.ind.ok{background:#D9F3E8;color:#157A52}.ind.no{background:#FBE0E0;color:#A32727}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:14px 0;overflow-x:auto}.tabs a{padding:9px 14px;font-weight:600;color:var(--m);white-space:nowrap}.tabs a.on{color:var(--p);border-bottom:3px solid var(--tl)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{min-height:70px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:11px;background:var(--c)}.cal .hd{min-height:0;border:0;background:none;font-weight:700;color:var(--m);text-align:center}.cal a{display:block;background:var(--sky);color:var(--p);border-radius:4px;padding:1px 4px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ph{max-width:390px;margin:10px auto}.mod{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.mod .card{max-width:380px;width:100%}
.tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30}.hb{display:none}
.ht{min-width:0}.tlv{display:none}.hh,.hw{display:flex;align-items:center}.hh b,.hw b{width:96px;flex:none;font-size:12px;color:var(--m)}.hw b{color:var(--t);font-size:13px}.hr{position:relative;flex:1;height:22px}.hr span{position:absolute;font-size:11px;color:var(--m);transform:translateX(-50%)}.hw .hr{height:160px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-top:4px;overflow:hidden}.hr i{position:absolute;top:0;bottom:0;border-left:1px solid var(--bd)}.hv{position:absolute;top:8px;bottom:8px;border-radius:8px;background:var(--p);color:#fff;font-size:12px;font-weight:600;padding:8px;overflow:hidden;white-space:normal;overflow-wrap:anywhere;line-height:1.35;display:flex;flex-direction:column;justify-content:center;gap:4px}.hv small{font-weight:400;opacity:.9;font-size:12px}.hv.Berlangsung{background:var(--ok)}.hv.Selesai{background:#8A94A3}.fc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.fc span{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--m)}
.dd{position:relative}.dd>a{cursor:pointer}.dd .dm{display:none;position:absolute;right:0;top:100%;min-width:230px;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:15}.dd:hover .dm,.dd.o .dm{display:block}.dm a{display:block;padding:9px 12px;border-radius:8px;color:var(--t)}.dm a:hover{background:var(--sky)}.dm small{display:block;color:var(--m);font-size:11px}
.lgw{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:16px}.lgw .card{width:100%;max-width:400px}.cap{display:flex;gap:8px;align-items:center}.cap b{background:var(--sky);padding:10px 14px;border-radius:8px;letter-spacing:2px;white-space:nowrap}.rm{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}.rm input{width:auto}.err{color:var(--er);font-size:13px;margin-top:8px}
.bg{background:var(--er);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:6px}.Menunggu{background:#FFF4CC;color:#8A6500}
.Dikembalikan{background:#FBE0E0;color:#A32727}
.cv{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start;margin-top:8px}.pn{display:flex;flex-direction:column;gap:12px;background:var(--sky);border-radius:12px;padding:12px}.pn label{display:block;margin:0 0 4px;font-size:12px;color:var(--m)}.pn input[type=range]{width:100%;padding:0}.rw{display:grid;grid-template-columns:70px 1fr 34px;align-items:center;gap:6px;font-size:13px}.rw b{font-size:12px;text-align:right}.fdd{position:relative}.fb{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left}.fl{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--c);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:240px;overflow:auto;margin-top:4px}.fl a{display:block;padding:9px 12px;font-size:17px;cursor:pointer}.fl a:hover,.fl a.on{background:var(--sky)}
@media(max-width:700px){.cv{grid-template-columns:1fr}}
.thfab{position:fixed;right:14px;bottom:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--c);color:var(--m);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:50;opacity:.85}.thfab:hover{opacity:1;color:var(--p)}
.acc{display:flex;flex-direction:column;align-items:flex-end;gap:4px;order:3}.btn.sm{padding:5px 12px;font-size:13px}
@media(max-width:820px){.acc{align-items:stretch}}
html[data-theme=dark]{--bg:#0E1420;--c:#172131;--t:#E7ECF4;--m:#9BA8BC;--bd:#27344A;--sky:#1C2D4A;--p:#8DB8FF;--ok:#3DBE8A;--er:#F26B6B;color-scheme:dark}
html[data-theme=dark] .side{background:linear-gradient(170deg,#0A2A63,#13498F)}
html[data-theme=dark] .hero{background:linear-gradient(120deg,#0B3C8C,#1C5FB0)}
html[data-theme=dark] .btn.w{background:#fff;color:#0B3C8C}
html[data-theme=dark] .Dijadwalkan,html[data-theme=dark] .Menunggu{background:#3A3010;color:#F5D66B}
html[data-theme=dark] .Berlangsung,html[data-theme=dark] .ind.ok{background:#12372B;color:#7EE0B5}
html[data-theme=dark] .Selesai{background:#2A3447;color:#B8C4D6}
html[data-theme=dark] .Dibatalkan,html[data-theme=dark] .Dikembalikan,html[data-theme=dark] .ind.no{background:#3D1E22;color:#FF9C9C}
html[data-theme=dark] .ev.Berlangsung{background:#12372B;color:#CFF5E3}
html[data-theme=dark] .ev.Selesai{background:#2A3447;color:#D6DEEA;border-color:#55657D}
html[data-theme=dark] .strip a.on,html[data-theme=dark] .steps .on,html[data-theme=dark] .hv{background:#1F5FB8;color:#fff;border-color:#1F5FB8}
html[data-theme=dark] .hv.Selesai{background:#55657D}
html[data-theme=dark] .dd .dm{background:var(--c)}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:#0F1828;color:var(--t);border-color:var(--bd)}
.tgl{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:99px;background:var(--c);padding:2px;cursor:pointer;order:4;margin-left:6px}.tgl span{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:var(--m)}.tgl span.on{background:var(--p);color:#fff}
html[data-theme=dark] .tgl span.on{background:#1F5FB8;color:#fff}
@media(max-width:600px){.pub{padding:0 12px 30px}.nav a.l{padding:6px 8px;font-size:14px}.hero{padding:20px}.hero h2{font-size:21px}.g3,.g4{grid-template-columns:1fr 1fr}.card{padding:14px}table{font-size:13px}.dd .dm{right:auto;left:0}h1{font-size:20px}}
@media(max-width:420px){.g3,.g4{grid-template-columns:1fr}.main{padding:12px}}
.nk{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.top2{margin:6px 0 16px}.top2 h1{font-size:24px}
@media(max-width:820px){.nk{order:6}.nav{justify-content:space-between}.nav .lg{margin:0}.nk{display:none;width:100%;flex-direction:column;align-items:stretch;gap:2px}.nav.open .nk{display:flex}.nk .dd .dm{position:static;box-shadow:none;border:0;min-width:0}.nk .dd:hover .dm{display:none}.nk .dd.o .dm{display:block}.nk .btn{text-align:center}}
@media(max-width:820px){.tlh{display:none}.tlv{display:block}.side{transform:translateX(-100%)}.side.open{transform:none}.main{margin-left:0;padding:16px}.hb{display:inline-block}.cols{grid-template-columns:1fr}}

/* ===== SINAR Atmosfer ===== */
:root{--glass:rgba(255,255,255,.68);--glx:rgba(255,255,255,.82);--shx:0 12px 34px rgba(11,60,140,.14);--bgc:#EAF4FF;--sky1:#7EC3F5;--sky2:#EAF4FF}
html[data-theme=dark]{--glass:rgba(12,24,48,.64);--glx:rgba(150,185,255,.18);--shx:0 12px 34px rgba(0,0,0,.5);--bgc:#050B1A;--sky1:#050B1A;--sky2:#13244A}
html{background:var(--bgc)}body{background:transparent;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
#sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));pointer-events:none}
#sky .sun{position:absolute;right:9%;top:15%;width:clamp(130px,16vw,210px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#FFF8D8 0 26%,rgba(255,214,102,.6) 42%,rgba(255,214,102,0) 70%);animation:fxpulse 8s ease-in-out infinite;transition:opacity 1s}
#sky .moon{position:absolute;right:9%;top:17%;width:clamp(120px,15vw,200px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 62% 36%,rgba(140,130,100,.32) 0 6%,transparent 7%),radial-gradient(circle at 34% 60%,rgba(140,130,100,.28) 0 10%,transparent 11%),radial-gradient(circle at 70% 72%,rgba(140,130,100,.26) 0 5%,transparent 6%),radial-gradient(circle at 30% 28%,#FFFDF0 0,#F3ECD2 50%,#D8D0B2 100%);box-shadow:0 0 70px 24px rgba(205,220,255,.28),inset -16px -12px 34px rgba(110,100,70,.28);opacity:0;transition:opacity 1s}
html[data-theme=dark] #sky .sun{opacity:0}html[data-theme=dark] #sky .moon{opacity:1}
#sky #stars{position:absolute;inset:0;opacity:0;transition:opacity 1s}html[data-theme=dark] #sky #stars{opacity:1}
#stars i{position:absolute;border-radius:50%;background:#fff;animation:fxtw 3.5s ease-in-out infinite}
#sky .cl{position:absolute;left:-280px;width:220px;height:64px;border-radius:99px;background:#fff;opacity:.78;filter:blur(1.5px);animation:fxdrift var(--t) linear infinite;animation-delay:var(--w)}
#sky .cl::before,#sky .cl::after{content:'';position:absolute;background:#fff;border-radius:50%}#sky .cl::before{width:90px;height:90px;left:30px;top:-44px}#sky .cl::after{width:70px;height:70px;left:105px;top:-30px}
html[data-theme=dark] #sky .cl{opacity:.08}
.card{background:var(--glass);border:1px solid var(--glx);box-shadow:var(--shx);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-radius:18px}
.nav{position:sticky;top:10px;z-index:30;padding:10px 16px;margin:10px 0;background:var(--glass);border:1px solid var(--glx);border-radius:20px;box-shadow:var(--shx);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.nav a.on,.nav a.l.on{background:linear-gradient(135deg,#0B3C8C,#16A34A);color:#fff}
.btn.pr{background:linear-gradient(135deg,#0B3C8C,#16A34A);color:#fff;border-color:transparent}.btn.pr:hover{box-shadow:0 8px 20px rgba(11,60,140,.3)}
input:not([type=range]):not([type=checkbox]):not([type=radio]),select,textarea{background:rgba(255,255,255,.58)}
html[data-theme=dark] input:not([type=range]):not([type=checkbox]):not([type=radio]),html[data-theme=dark] select,html[data-theme=dark] textarea{background:rgba(255,255,255,.07)}
.hv{animation:fxgrow .8s .15s cubic-bezier(.2,.9,.3,1) both;transform-origin:left}
.thfab{background:var(--glass);backdrop-filter:blur(10px)}
#spl{position:fixed;inset:0;z-index:300;display:grid;place-items:center;text-align:center;background:linear-gradient(180deg,var(--sky1),var(--sky2));transition:opacity .7s,visibility .7s;cursor:pointer}#spl.off{opacity:0;visibility:hidden}
#spl .spc{display:flex;flex-direction:column;align-items:center;gap:6px}#spl img{height:110px;animation:fxpop 1s cubic-bezier(.2,1.4,.4,1) both}#spl h1{font-size:34px;font-weight:800;color:var(--t);animation:fxrise .9s .4s both}#spl h1 span{color:var(--g)}#spl p{color:var(--m);animation:fxrise .9s .6s both}
#spl .sx path{fill:none;stroke:var(--g);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;animation:fxdraw 2.2s .5s ease forwards}
#splskip{position:fixed;right:16px;bottom:16px;border:1px solid var(--glx);background:var(--glass);color:var(--t);font:600 12px inherit;font-family:inherit;padding:8px 14px;border-radius:99px;cursor:pointer}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
@keyframes fxpulse{50%{transform:scale(1.1)}}@keyframes fxdrift{to{transform:translateX(calc(100vw + 600px))}}@keyframes fxtw{50%{opacity:.2}}@keyframes fxgrow{from{opacity:0;transform:scaleX(.2)}}@keyframes fxpop{from{opacity:0;transform:scale(.6)}}@keyframes fxrise{from{opacity:0;transform:translateY(14px)}}@keyframes fxdraw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== perbaikan + kontrol latar ===== */
.nav a.on,.nav a.l.on{background:var(--g);color:#fff}
.btn.pr{background:var(--g);color:#fff;border-color:transparent}.btn.pr:hover{background:#27863F;box-shadow:0 8px 20px rgba(22,120,60,.3)}
.hr .hv span{position:static;transform:none;color:inherit;font-size:12.5px;font-weight:700;display:block;line-height:1.3}
.hw .hr{background:rgba(255,255,255,.4)}html[data-theme=dark] .hw .hr{background:rgba(255,255,255,.04)}
:root{--plain:#F1F5FA}html[data-theme=dark]{--plain:#0A1220}
html[data-bg=diam] #sky .cl{animation:none;left:var(--sx)}html[data-bg=diam] #sky .sun,html[data-bg=diam] #stars i{animation:none}
html[data-bg=polos] #sky{background:var(--plain)}html[data-bg=polos] #sky .sun,html[data-bg=polos] #sky .moon,html[data-bg=polos] #sky #stars,html[data-bg=polos] #sky .cl{display:none}
#bgmenu{position:fixed;right:16px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:60;display:none;flex-direction:column;gap:2px;padding:10px;min-width:190px;background:var(--glass);border:1px solid var(--glx);border-radius:14px;box-shadow:var(--shx);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}#bgmenu.open{display:flex}
#bgmenu b{font-size:12px;color:var(--m);padding:2px 8px 6px}#bgmenu button{border:0;background:transparent;color:var(--t);text-align:left;padding:9px 10px;border-radius:8px;font:600 13px inherit;font-family:inherit;cursor:pointer}#bgmenu button:hover{background:rgba(120,160,220,.2)}#bgmenu button.on{background:var(--g);color:#fff}

/* ===== timeline baru ===== */
.sc{overflow-x:auto;padding-bottom:6px}.ht{min-width:880px;position:relative;--lw:150px}
.hh b,.hw b{width:var(--lw)!important;flex:none}.hh .hr span{font-size:11px;font-weight:600;color:var(--m)}
.hw{margin-top:8px;align-items:stretch}.hw b{display:flex;align-items:center;padding-right:10px;font-size:13px;font-weight:700;line-height:1.3;color:var(--t)}
.hw .hr{height:70px!important;border:1px solid var(--glx);border-radius:14px;background:rgba(255,255,255,.42);overflow:visible;margin-top:0}
html[data-theme=dark] .hw .hr{background:rgba(255,255,255,.05)}.hr i{border-left:1px solid rgba(11,60,140,.09)}
.hv{top:9px!important;bottom:9px!important;height:auto!important;border-radius:11px;padding:6px 10px;background:#0B3C8C!important;color:#fff!important;border:0!important;box-shadow:0 4px 12px rgba(11,60,140,.25);display:flex;flex-direction:column;justify-content:center;overflow:hidden;transition:transform .2s,box-shadow .2s}
.hr .hv span{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hv small{font-size:11px;opacity:.9;white-space:nowrap}
.hv:hover{transform:translateY(-2px);z-index:6;overflow:visible;min-width:210px;box-shadow:0 10px 24px rgba(11,60,140,.4)}.hv:hover span{white-space:normal}
.hv.Menunggu{background:repeating-linear-gradient(45deg,#6B7685 0 8px,#7C8CA3 8px 16px)!important;opacity:.85}
.ev,.ev.Berlangsung,.ev.Selesai,.ev.Dijadwalkan{background:#0B3C8C!important;color:#fff!important;border-color:transparent!important}.ev .bd{display:none}
.nowl{position:absolute;top:0;bottom:0;width:2px;background:#EF4444;z-index:4;pointer-events:none;left:calc(var(--lw) + (100% - var(--lw)) * var(--f))}.nowl::before{content:'';position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:#EF4444}
.foot{text-align:center;margin:28px 0 70px;font-size:13px;color:var(--m)}.foot a{color:var(--p);font-weight:600}

/* ===== rapikan timeline dan navigasi ===== */
.nav a.on,.nav a.l.on{background:rgba(11,60,140,.12);color:var(--p);font-weight:700}
html[data-theme=dark] .nav a.on,html[data-theme=dark] .nav a.l.on{background:rgba(141,184,255,.18)}
.dn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dn .seg{display:flex;align-items:center;background:var(--glass);border:1px solid var(--glx);border-radius:12px;padding:3px;box-shadow:var(--shx)}
.dn .seg button{width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--t);font-size:17px;cursor:pointer;transition:background .2s}.dn .seg button:hover{background:rgba(120,160,220,.2)}
.dn .seg b{min-width:180px;text-align:center;font-size:14px;padding:0 10px}
.dn .cal{position:relative;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--glx);background:var(--glass);border-radius:12px;color:var(--t);cursor:pointer;box-shadow:var(--shx)}
.dn .cal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dn .today{height:42px;padding:0 16px;border:1px solid var(--glx);background:var(--glass);border-radius:12px;color:var(--p);font:700 13px inherit;font-family:inherit;cursor:pointer;box-shadow:var(--shx)}.dn .today:hover{background:rgba(120,160,220,.2)}
.nowl{z-index:1;top:30px}.hv{z-index:2}.hv:hover{z-index:6}
.upc .bd{display:none}
